[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "liq-runner"
version = "0.1.0"
description = "Pipeline orchestration and rolling-run utilities for the LIQ Stack"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Latent Infinity", email = "dev@latentinfinity.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]
dependencies = [
    "liq-core>=0.1.0",
    "liq-metrics>=0.1.0",
    "liq-risk>=0.1.0",
    "liq-signals>=0.1.0",
    "liq-sim>=0.1.0",
    "polars>=0.20",
]

[project.scripts]
liq-runner = "liq.runner.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.14",
    "mypy>=1.13",
]

[project.urls]
Homepage = "https://github.com/Latent-Infinity/liq-runner"
Repository = "https://github.com/Latent-Infinity/liq-runner"

[tool.hatch.build.targets.wheel]
packages = ["src/liq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --cov=liq.runner --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
source = ["src/liq/runner"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "raise NotImplementedError",
    "\\.\\.\\.",
    "pass",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "ARG",
    "SIM",
]
ignore = [
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]

[tool.ruff.lint.isort]
known-first-party = ["liq"]
